name: Deploy API

# Branch → environment:
#   main    → production  (image tag `latest`,      api.<domain>)
#   testing → testing     (image tag `testing`,     api-test.<domain>)
on:
  push:
    branches: [main, testing]
    paths:
      - apps/api/**
      - packages/database/**
      - packages/typescript-config/**
      - pnpm-lock.yaml
      - .dockerignore
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

# One deploy at a time per branch; a newer push waits for the current one.
concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/finnit-api

jobs:
  build:
    name: Build, smoke test and push (arm64)
    # Native arm64 runner: the Hetzner CAX server is ARM, so no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      channel: ${{ steps.vars.outputs.channel }}
      environment: ${{ steps.vars.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: vars
        run: |
          case "$GITHUB_REF_NAME" in
            main)    environment=production;  channel=latest ;;
            testing) environment=testing;     channel=testing ;;
            *) echo "::error::Branch '$GITHUB_REF_NAME' has no environment; deploy from main or testing."; exit 1 ;;
          esac
          {
            echo "tag=sha-${GITHUB_SHA::7}"
            echo "channel=$channel"
            echo "environment=$environment"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          load: true
          tags: finnit-api:ci
          cache-from: type=gha,scope=finnit-api
          cache-to: type=gha,mode=max,scope=finnit-api

      - name: Smoke test (migrations + health + auth flow)
        run: apps/api/scripts/smoke-test.sh finnit-api:ci

      - name: Upload API logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-log
          path: smoke-api.log

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          for tag in "${{ steps.vars.outputs.tag }}" "${{ steps.vars.outputs.channel }}"; do
            docker tag finnit-api:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

  deploy:
    name: Deploy to Dokploy (${{ needs.build.outputs.environment }})
    needs: build
    runs-on: ubuntu-latest
    # Each GitHub environment holds its own Dokploy secrets (the application
    # ID differs); add required reviewers to `production` to gate its deploys.
    environment: ${{ needs.build.outputs.environment }}
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'content-type: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}"

      - name: Summary
        run: |
          echo "Deployed \`$IMAGE:${{ needs.build.outputs.tag }}\` to **${{ needs.build.outputs.environment }}** (also tagged \`${{ needs.build.outputs.channel }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: set the Dokploy image to a previous \`sha-*\` tag and redeploy." >> "$GITHUB_STEP_SUMMARY"
