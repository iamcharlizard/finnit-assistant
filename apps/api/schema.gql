input TransactionFilters {
  accountId: String

  """Movements of any of these accounts (empty: none)"""
  accountIds: [ID!]

  """
  Only movements shown with this alias rule's automatic name (no one-off name)
  """
  aliasId: ID

  """
  categoryIds / includeUncategorized only narrow expenses; other movements pass
  """
  categoriesForExpensesOnly: Boolean

  """
  true: only movements that can take a category (expenses and income, not transfers, adjustments or possible transfers waiting for an answer)
  """
  categorizable: Boolean
  categoryId: String

  """
  Movements in any of these categories (a parent includes its subcategories; empty with no includeUncategorized: none)
  """
  categoryIds: [ID!]
  endDate: DateTime

  """true: only movements with a pending category suggestion"""
  hasSuggestion: Boolean

  """With categoryIds: also movements without a category; alone: only those"""
  includeUncategorized: Boolean
  isPending: Boolean

  """
  Matches the display name, and the original text only for non-private movements
  """
  search: String
  source: TransactionSource
  startDate: DateTime
  type: TransactionType

  """Movements of any of these types (empty: none)"""
  types: [TransactionType!]

  """true: only movements without a category; false: only with one"""
  uncategorized: Boolean
}

