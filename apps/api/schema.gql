  amountTotal: Float
  categories: [BudgetCategoryInput!]
}

input UpdateCategoryInput {
  name: String
  parentId: String
  sortOrder: Float
}

input UpdateDebtInput {
  dueDate: DateTime
  interestRateAnnual: Float
  linkedAccountId: String
  minPaymentAmount: Float
  name: String
}

input UpdateRecurringExpenseInput {
  accountId: String
  active: Boolean
  amount: Float
  categoryId: String
  debtId: String
  endDate: DateTime
  frequency: RecurringFrequency
  installmentsPaid: Int
  installmentsTotal: Int
  interval: Int
  isVariableAmount: Boolean
  kind: RecurringExpenseKind
  merchantPattern: String
  name: String
  notes: String
  startDate: DateTime
  trackingMode: RecurringTrackingMode
}

input UpdateStatementLineInput {
  categoryId: String

  """Link to a recurring payment (null to unlink)"""
  matchedOccurrenceId: String

  """Link to an existing transaction (null to unlink)"""
  matchedTransactionId: String

  """Only pending or ignored can be set by hand"""
  status: StatementLineStatus
}

input UpdateTransactionInput {
  amount: Float
  categoryId: String
  description: String
  isPending: Boolean
  merchantName: String
  txnDate: DateTime
}

input UpdateUserInput {
  email: String
  name: String
}

type User {
  createdAt: DateTime!
  email: String!
  id: String!
  name: String!
  updatedAt: DateTime!
}

input WhatIfInput {
  monthlyExpenses: Float!
  monthlyIncome: Float!
  monthsToProject: Int!
  scenarioName: String!
