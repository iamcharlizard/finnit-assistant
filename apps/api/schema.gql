type Transaction {
  account: Account
  accountId: String!

  """Merchant alias rule matching this movement"""
  aliasId: ID

  """The alias rule that names this movement (automatic name)"""
  aliasRule: TransactionAliasRule
  amount: Float!
  attachments: [Attachment!]

  """
  What it adds (+) or takes (−) from its account balance; null for old adjustments of unknown direction
  """
  balanceEffect: Float
  category: Category
  categoryId: String
  categorySource: CategorySource
  createdAt: DateTime!
  currency: String!
  description: String

  """
  Name to show: one-off alias, else the matching alias rule, else merchantName, else description
  """
  displayName: String!
  externalId: String

  """A one-off display name is set on this movement"""
  hasOwnAlias: Boolean!
  id: String!

  """
  "En proceso": the bank shows it but hasn't applied it yet. It counts in the balance; it clears when the applied movement arrives
  """
  inProcess: Boolean!
  isPending: Boolean!

  """
  Private (one-off or alias rule): description, merchantName and originalDescription are null except in transaction(id)
  """
  isPrivate: Boolean!
  isRecurringInstance: Boolean!

  """
  The loan payment this movement is (one query per movement; for the detail, not lists)
  """
  loanPayment: TransactionLoanPayment
  merchantName: String

  """The user's notes; null for private movements except in transaction(id)"""
  notes: String

  """
  merchantName ?? description, never modified. Null for private movements except in transaction(id)
  """
  originalDescription: String

  """
  The bank text is hidden behind the privacy PIN (protected rule, request not unlocked)
  """
  originalLocked: Boolean!

  """
  The movement's own privacy flag; isPrivate is also true when its alias rule is private
  """
  ownPrivate: Boolean!

  """
  The recurring payment this movement paid (one query per movement; for the detail, not lists)
  """
  recurringPayment: TransactionRecurringPayment
  source: String!

  """Pending AI/rule suggestion, not applied until accepted"""
  suggestedCategory: Category

  """
  For transfers: the other side (one query per movement; for the detail, not lists)
  """
  transferCounterpart: TransferCounterpart

  """
  For transfers: "out" on the source account, "in" on the destination; null otherwise
  """
  transferDirection: String

  """
  For transfers: the transfer both sides share (batched; lists use it to group them)
  """
  transferId: ID
  txnDate: DateTime!
  type: String!
  updatedAt: DateTime!
  userId: String!
}

input TransactionAliasInput {
  """
  One-off display name; null or "" clears it, omitted leaves it unchanged
  """
