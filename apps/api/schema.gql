    """Only active models"""
    activeOnly: Boolean
    provider: AiProvider
  ): [AiModel!]!
  bankConnections: [BankConnection!]!
  budget(id: String!): Budget!
  budgetAlerts: [BudgetAlert!]!
  budgetSummary(month: Float!, year: Float!): BudgetSummary!
  budgetUsage(id: String!): [BudgetUsage!]!
  budgets: [Budget!]!
  cardMonthSummary(accountId: String!, month: Int!, year: Int!): CardMonthSummary!
  cashFlowBaseline: CashFlowBaseline!
  cashFlowProjection(monthsAhead: Int! = 6): [CashFlowProjection!]!

  """
  The catalog and the user's own categories; with includeHidden, also the ones they hid
  """
  categories(includeHidden: Boolean = false): [Category!]!
  category(id: String!): Category!

  """What uses one of the user's categories (before deleting it)"""
  categoryReferences(id: String!): CategoryReferences!
  categoryUsage(dateFrom: DateTime, dateTo: DateTime): [CategoryUsage!]!

  """By name"""
  contacts: [Contact!]!

  """
  One billing cycle (default: the last closed one, whose payment is due now); null for other accounts and cards without cut-off and payment days
  """
  creditCardPeriod(
    accountId: ID!

    """
    The cycle with this cut-off day (YYYY-MM-DD); default: the last closed one, whose payment is due now
    """
    statementDate: String
  ): CreditCardPeriod

  """
  A credit card's billing cycles, newest (the running one) first; empty for other accounts and cards without cut-off and payment days
  """
  creditCardPeriods(
    accountId: ID!

    """Cursor: the cycles before this cut-off day (YYYY-MM-DD)"""
    after: String
    first: Int! = 6
  ): CreditCardPeriodConnection!
  currentBudget: Budget

  """
  Confirmed income and expenses per day, from/to YYYY-MM-DD (at most 92 days)
  """
  dailyCashFlow(from: String!, to: String!): [DailyCashFlow!]!
  debt(id: String!): Debt!

  """
  Debt by type, payments per month (historical apart), projected balance and what is due soon
  """
  debtInsights(
    """Months of balance projection (default 24)"""
    horizon: Int

    """Only loans (no cards, other debts or card MSI plans)"""
    loansOnly: Boolean

    """Months of payment history, this one included (default 12)"""
    months: Int
  ): DebtInsights!
  debtSummary: DebtSummary!
  debts(after: String, before: String, first: Int, includePayoffProjections: Boolean, kind: DebtKind, last: Int): DebtConnection!

  """
  Movements of the same account that may be this one recorded again (same amount and direction, a few days apart), closest first
  """
  duplicateCandidates(transactionId: ID!): [Transaction!]!

  """Possible duplicates waiting for the user"""
  duplicateSuggestions(after: String, first: Int = 20): DuplicateSuggestionConnection!
  goal(id: String!): Goal!

  """Newest first"""
  goalContributions(goalId: ID!): [GoalContribution!]!
  goalProgress(id: String!): GoalProgress!
  goalProjection(
    goalId: ID!

    """
    Amount saved per month; defaults to the average of the last 3 months of contributions
    """
    monthlyContribution: Float
  ): GoalProjection!

  """Over all the user's goals, or only goalId when given"""
  goalRecommendations(goalId: ID): GoalRecommendations!
  goals: [Goal!]!

  """
  Expense movements that could be this loan payment: close in amount and date, those naming the loan first
  """
  loanExpenseCandidates(
    occurrenceId: ID!

    """
    Text to look for instead (any amount, the last year): when the movement is not among the matches
    """
    search: String
  ): [LoanExpenseCandidate!]!

  """
  Loans and payments an expense movement can pay; the payment due the same day is suggested
  """
  loanLinkOptions(transactionId: ID!): LoanLinkOptions!

  """
  Bank movements that look like open payments of a loan; confirm them with confirmLoanPayment
  """
  loanPaymentCandidates(debtId: ID!): [LoanPaymentCandidate!]!

  """
  Every payment of a loan by date: paid (historical included), open and projected until it is paid off
  """
  loanSchedule(debtId: ID!): [LoanScheduleItem!]!
  me: User!

  """The user's merchant aliases, highest priority first"""
  merchantAliases: [MerchantAlias!]!

  """Learned merchant → category rules, most recent first"""
  merchantRules: [MerchantRule!]!
  monthlyReport(month: Int!, year: Int!): MonthlyReport!
  notifications(
    after: String
    first: Int
    status: NotificationStatus

    """
    true: only notifications not read yet (scheduled or sent); overrides `status`
    """
    unread: Boolean
  ): NotificationConnection!
  payoffStrategy(input: PayoffStrategyInput!): [DebtPayoffProjection!]!

  """
  Movements a candidate alias would match (count and up to 20, newest first), without saving
  """
  previewMerchantAlias(
    """The rule being edited"""
    aliasId: ID
    input: MerchantAliasInput!
  ): AliasPreview!
  privacyStatus: PrivacyStatus!

  """Poll it after uploading (POST /receipts) to follow the status"""
  receiptImport(id: ID!): ReceiptImport!

  """Newest first"""
  receiptImports(after: String, first: Int): ReceiptImportConnection!
  recurringExpense(id: ID!): RecurringExpense!
  recurringExpenseOccurrences(from: DateTime, recurringExpenseId: ID!, to: DateTime): [RecurringOccurrence!]!
  recurringExpenses(
    accountId: String

    """Defaults to active expenses only"""
    active: Boolean
    after: String
    first: Int = 20
    kind: RecurringExpenseKind
    trackingMode: RecurringTrackingMode
  ): RecurringExpenseConnection!
  recurringExpensesSummary: RecurringExpensesSummary!

  """
  The recurring expenses (not loans) an expense may have paid, with their payment in each month around the expense's; those that fit first
  """
  recurringLinkOptions(transactionId: ID!): RecurringLinkOptions!

  """
  Prefilled loan for a suggestion that pays a loan; accept it with acceptRecurringSuggestionAsLoan
  """
