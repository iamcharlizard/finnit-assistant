type Transaction {
  account: Account
  accountId: String!

  """Merchant alias rule matching this movement"""
  aliasId: ID
  amount: Float!
  attachments: [Attachment!]
  category: Category
  categoryId: String
  categorySource: CategorySource
  createdAt: DateTime!
  currency: String!
  description: String

  """
  Name to show: one-off alias, else the matching alias rule, else merchantName, else description
  """
  displayName: String!
  externalId: String

  """A one-off display name is set on this movement"""
  hasOwnAlias: Boolean!
  id: String!
  isPending: Boolean!

  """
  Private (one-off or alias rule): description, merchantName and originalDescription are null except in transaction(id)
  """
  isPrivate: Boolean!
  isRecurringInstance: Boolean!
  merchantName: String

  """
  merchantName ?? description, never modified. Null for private movements except in transaction(id)
  """
  originalDescription: String

  """
  The recurring payment this movement paid (one query per movement; for the detail, not lists)
  """
  recurringPayment: TransactionRecurringPayment
  source: String!

  """Pending AI/rule suggestion, not applied until accepted"""
  suggestedCategory: Category

  """
  For transfers: the other side (one query per movement; for the detail, not lists)
  """
  transferCounterpart: TransferCounterpart

  """
  For transfers: "out" on the source account, "in" on the destination; null otherwise
  """
  transferDirection: String
  txnDate: DateTime!
  type: String!
  updatedAt: DateTime!
  userId: String!
}

input TransactionAliasInput {
  """
  One-off display name; null or "" clears it, omitted leaves it unchanged
