type Mutation {
  """
  Applies the pending suggestions and learns merchant rules; returns how many were applied
  """
  acceptCategorySuggestions(ids: [ID!]!): Int!

  """
  Creates the recurring expense of a suggestion and links its past movements as paid occurrences
  """
  acceptRecurringSuggestion(fingerprint: ID!, input: AcceptRecurringSuggestionInput): RecurringExpense!

  """
  Turns a recurring suggestion into a loan: its detected charges become paid installments
  """
  acceptRecurringSuggestionAsLoan(fingerprint: ID!, input: AcceptSuggestionAsLoanInput!): Debt!

  """Adds money to a loan: another personal loan or a financed purchase"""
  addDebtCharge(input: AddDebtChargeInput!): Debt!
  addGoalContribution(input: CreateGoalContributionInput!): GoalContribution!
  adjustAccountBalance(input: AdjustBalanceInput!): Account!

  """
  Categorizes the uncategorized movements: from past categorizations (merchant rules, aliases, history), with AI suggestions to review, or both; refreshes the to-review notification
  """
  autoCategorizeTransactions(mode: AutoCategorizeMode = history): AutoCategorizeResult!

  """
  Moves movements (max 500) to a category; with createRule, learns a merchant rule per merchant. Returns how many changed
  """
  categorizeTransactions(categoryId: ID!, createRule: Boolean = true, ids: [ID!]!): Int!

  """
  Links a movement to an open payment of a loan; its merchant becomes the loan pattern for later syncs
  """
  confirmLoanPayment(occurrenceId: ID!, transactionId: ID!): Debt!

  """
  Creates the expense with the photo attached, or attaches the photo to `attachToTransactionId`
  """
  confirmReceiptImport(id: ID!, input: ConfirmReceiptImportInput!): ReceiptImport!

  """
  Creates the included movements (the ones already registered are linked, not created)
  """
  confirmScreenshotImport(id: ID!): ScreenshotImport!

  """
  Creates the pending movements as transactions and marks matched recurring payments as paid
  """
  confirmStatementImport(id: ID!): StatementImport!

  """
  Turns an expense/income into a transfer side, linking or creating the other side
  """
  convertToTransfer(input: ConvertToTransferInput!): Transfer!
  createAccount(input: CreateAccountInput!): Account!

  """Admin only"""
  createAiModel(input: CreateAiModelInput!): AiModel!

  """
  Short-lived Syncfy session for @finnit/bank-connect (or the widget fallback). When the connection succeeds, call registerBankConnection with its id_credential.
  """
  createBankConnectSession: BankConnectSession!
  createBudget(input: CreateBudgetInput!): Budget!
  createBudgetFromTemplate(input: BudgetFromTemplateInput!): Budget!
  createCategory(input: CreateCategoryInput!): Category!

  """Adds a contact; returns the existing one with that name"""
  createContact(input: CreateContactInput!): Contact!

  """
  Creates a debt; with a loanType, a loan with its terms, payment schedule and payments already made
  """
  createDebt(input: CreateDebtInput!): Debt!
  createDebtPayment(input: CreateDebtPaymentInput!): DebtPayment!
  createDefaultCategories: Boolean! @deprecated(reason: "Default categories are a global catalog every user already sees")
  createGoal(input: CreateGoalInput!): Goal!

  """Creates an alias and applies it to existing movements"""
  createMerchantAlias(input: MerchantAliasInput!): MerchantAlias!
  createRecurringExpense(input: CreateRecurringExpenseInput!): RecurringExpense!
  createTransaction(input: CreateTransactionInput!): Transaction!
  createTransfer(input: CreateTransferInput!): Transfer!

  """
  Admin only. Gives a person access: they sign in with the password set here, or with Google using this email.
  """
  createUser(input: CreateUserInput!): AdminUser!
  deleteAccount(id: String!): Boolean!

  """Admin only"""
  deleteAiModel(id: ID!): Boolean!

  """
  Removes the connection from Finnit; imported transactions stay. Delete the bank login in Syncfy separately.
  """
  deleteBankConnection(id: ID!): Boolean!
  deleteBudget(id: String!): Boolean!
  deleteCategory(
    id: String!

    """
    Where its movements, budgets, rules and subcategories go (required when in use)
    """
    moveToId: String
  ): Boolean!
  deleteDebt(id: String!): Boolean!
  deleteDebtCharge(id: ID!): Debt!

  """Fails while the goal has contributions"""
  deleteGoal(id: ID!): Boolean!

  """Deletes a historical payment (one without a movement)"""
  deleteHistoricalDebtPayment(id: ID!): Boolean!
  deleteMerchantAlias(id: ID!): Boolean!
  deleteMerchantRule(id: ID!): Boolean!
  deleteRecurringExpense(id: ID!): Boolean!
  deleteStatementImport(id: ID!): Boolean!
  deleteTransaction(id: String!): Boolean!

  """
  Deletes a transfer: sides it created are deleted; sides that were expenses/income (or came from the bank) go back to being them
  """
  deleteTransfer(transferId: ID!): Boolean!

  """Admin only. Blocks sign-in and ends their open sessions."""
  disableUser(id: ID!): AdminUser!

  """Discards the draft and deletes the photo"""
  discardReceiptImport(id: ID!): Boolean!

  """Discards the screenshot and deletes the image"""
  discardScreenshotImport(id: ID!): Boolean!
  dismissRecurringSuggestion(fingerprint: ID!): Boolean!

  """Admin only"""
  enableUser(id: ID!): AdminUser!

  """Hides a category and its subcategories from the pickers"""
  hideCategory(id: String!): Boolean!

  """Public (no sign-in): adds an email to the waitlist. Rate-limited."""
  joinWaitlist(input: JoinWaitlistInput!): JoinWaitlistResult!

  """
  Links a bank account to a Finnit account (or creates one) and imports its last 90 days
  """
  linkBankAccount(input: LinkBankAccountInput!, linkedAccountId: ID!): BankSyncResult!

  """
  Links an expense movement to a loan payment (open, or paid without a movement)
  """
  linkLoanPayment(occurrenceId: ID!, transactionId: ID!): Debt!

  """
  Links an expense to a recurring expense's payment of a month (default: the expense's): marks it paid, creating it when it wasn't generated, and gives the expense the recurring expense's category (undo with reopenRecurringPayment)
  """
  linkRecurringPayment(
    """YYYY-MM; default: the expense's month"""
    month: String
    recurringExpenseId: ID!
    transactionId: ID!
  ): Boolean!

  """
  Admin only: maps a Finnit user (by email) to an existing Syncfy user (id_user or id_external)
  """
  linkSyncfyUser(email: String!, syncfyUser: String!): Boolean!
  markAllNotificationsAsRead: Boolean!
  markNotificationAsRead(id: String!): Boolean!

  """Marks a manual (or unmatched automatic) payment as paid"""
  markRecurringPaymentPaid(occurrenceId: ID!, transactionId: ID): RecurringOccurrence!

  """
  Merges two records of the same money: the bank one stays, the other is deleted with its balance; returns the one kept
  """
  mergeTransactions(input: MergeTransactionsInput!): Transaction!

  """Pays a debt from an account: creates the expense movement and links it"""
  recordDebtPayment(input: RecordDebtPaymentInput!): Debt!
  refreshToken(input: RefreshTokenInput!): AuthPayload!
  registerBankConnection(idCredential: String!): BankSyncResult!

  """Discards the pending suggestions; returns how many"""
  rejectCategorySuggestions(ids: [ID!]!): Int!
  removeCreditCardTerms(accountId: ID!): Account!
  removeGoalContribution(id: ID!): Boolean!

  """
  Removes the uploaded profile photo (back to the Google picture or initials)
