}

"""The alias rule that gives a movement its automatic name"""
type TransactionAliasRule {
  displayName: String!
  id: ID!
  isPrivate: Boolean!

  """Needs the privacy PIN to see its pattern or the bank text"""
  isProtected: Boolean!

  """
  What it looks for; null for private movements except in transaction(id), and for protected rules until unlocked
  """
  pattern: String
}

