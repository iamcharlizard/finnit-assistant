  """
  Deletes the attachment and its file. Upload with POST /transactions/:id/attachments
  """
  removeTransactionAttachment(id: String!): Boolean!

  """Admin only. Only for users with Google linked."""
  removeUserPassword(id: ID!): AdminUser!

  """Undoes paid/skipped/missed and unlinks the transaction"""
  reopenRecurringPayment(occurrenceId: ID!): RecurringOccurrence!

  """
  Extracts the PDF again, optionally with a specific parser: "banamex_v1", "ai" (AI catalog) or "ai:<AI model id>"
  """
  reprocessStatementImport(id: ID!, parser: String): StatementImport!
  requestPasswordReset(input: RequestPasswordResetInput!): Boolean!

  """Emails a link to choose a new privacy PIN"""
  requestPrivacyPinReset: Boolean!

  """
  Moves an open scheduled payment of a loan to another day (it keeps its schedule date)
  """
  rescheduleLoanPayment(dueDate: DateTime!, occurrenceId: ID!): Debt!
  resetPassword(input: ResetPasswordInput!): Boolean!

  """Sets a new privacy PIN with the emailed link"""
  resetPrivacyPin(pin: String!, token: String!): Boolean!

  """Merge a suggested pair, or say it is not a duplicate"""
  resolveDuplicateSuggestion(input: ResolveDuplicateSuggestionInput!): Boolean!
  resolveTransferSuggestion(id: ID!, input: ResolveTransferSuggestionInput!): Boolean!

  """
  Sets the account's balance to the real one; the difference is an adjustment
  """
  setAccountBalance(input: SetAccountBalanceInput!): Account!

  """Sets the billing terms of one of the user's credit accounts"""
  setCreditCardTerms(accountId: ID!, input: CreditCardTermsInput!): Account!

  """Creates or changes the privacy PIN; ends every unlock"""
  setPrivacyPin(input: SetPrivacyPinInput!): Boolean!

  """The account the screenshot is about; its lines start over"""
  setScreenshotAccount(accountId: String!, id: ID!): ScreenshotImport!

  """
