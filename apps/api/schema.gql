type StatementLine {
  """Positive; `kind` gives the direction"""
  amount: Float!
  currency: String!
  date: DateTime!
  description: String
  id: ID!
  installmentNumber: Int
  installmentTotal: Int
  kind: StatementLineKind!

  """Recurring payment this line pays"""
  matchedOccurrenceId: String

  """The recurring payment of matchedOccurrenceId, with its name"""
  matchedRecurringPayment: StatementLineRecurringPayment

  """Existing or created transaction"""
  matchedTransactionId: String
  merchant: String
  postDate: DateTime
  status: StatementLineStatus!
  suggestedCategoryId: String
}

enum StatementLineKind {
  charge
  deposit
  fee
  installment
  interest
  payment
  refund
}

"""The recurring payment a statement line pays"""
type StatementLineRecurringPayment {
  dueDate: DateTime!
  name: String!
  occurrenceId: ID!
  recurringExpenseId: ID!
}

"""
pending: becomes a new transaction on confirm. matched: already registered. created: transaction created on confirm. ignored: skipped.
"""
enum StatementLineStatus {
  created
  ignored
  matched
  pending
}

enum StatementSource {
  belvo
  pdf
}

"""
uploaded → processing → needs_review (extracted, waiting for confirmation) → confirmed; failed on errors.
"""
enum StatementStatus {
  confirmed
  failed
  needs_review
  processing
  uploaded
}

