  """Bank movements that look like transfers, waiting for review"""
  transferSuggestions(after: String, first: Int = 20): TransferSuggestionConnection!
  transfers: [Transfer!]!
  upcomingPayments(accountId: String, from: DateTime!, to: DateTime!): [UpcomingPayment!]!
  validateToken(token: String!): TokenValidationResult!

  """Admin only"""
  waitlistEntries(after: String, first: Int = 50): WaitlistEntryConnection!
  whatIfScenario(input: WhatIfInput!): WhatIfResult!
}

