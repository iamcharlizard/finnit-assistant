  transactions(after: String, before: String, filters: TransactionFilters, first: Int, last: Int): TransactionConnection!
  transfer(id: String!): Transfer!

  """
  Movements in other accounts that may be the other side of this expense/income, best first
  """
  transferCandidates(accountId: ID, transactionId: ID!): [Transaction!]!

