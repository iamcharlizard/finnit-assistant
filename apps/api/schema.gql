    accountId: ID!
    amount: Float!

    """Date of the new transaction; matches within 3 days of its local day"""
    date: DateTime!
    type: TransactionType
  ): [Transaction!]!

  """Includes the lines; poll it after uploading to follow the status"""
  statementImport(id: ID!): StatementImport!
  statementImports(accountId: String, after: String, first: Int = 20): StatementImportConnection!
  suggestCategoryForMerchant(input: SuggestCategoryInput!): Category

  """
  One movement; unlike lists, it includes the original text of private movements
  """
  transaction(id: String!): Transaction!

  """
  Confirmed spending by category of the movements that pass these filters (the history chart)
