version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: finnit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finnit_db
      POSTGRES_USER: finnit_user
      POSTGRES_PASSWORD: finnit_password
    ports:
      # Override with POSTGRES_PORT if 5432 is taken (update DATABASE_URL to match).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume mounts the parent directory. Postgres 15 data lives in the
      # old `postgres_data` volume, which 18 cannot read.
      - postgres18_data:/var/lib/postgresql
      - ./packages/database/init:/docker-entrypoint-initdb.d
    networks:
      - finnit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnit_user -d finnit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible storage for statement PDFs in local development.
  # API env: S3_ENDPOINT=http://localhost:9090 S3_BUCKET=finnit-files-local
  #          AWS_ACCESS_KEY_ID=local AWS_SECRET_ACCESS_KEY=local
  # (MinIO no longer publishes images; s3mock does not check credentials.)
  s3:
    image: adobe/s3mock:4.8.0
    container_name: finnit-s3
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: finnit-files-local
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    ports:
      - "${S3_PORT:-9090}:9090"
    volumes:
      - s3_data:/data
    networks:
      - finnit-network

  # Opcional: pgAdmin para administración visual de la base de datos
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finnit-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finnit.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - finnit-network
    depends_on:
      - postgres

volumes:
  postgres18_data:
    driver: local
  pgadmin_data:
    driver: local
  s3_data:
    driver: local

networks:
  finnit-network:
    driver: bridge
